[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-sec-check"
version = "1.0.0"
description = "Check TLS, certificates, security headers and cookies of your own web sites"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Razim Kudaybergenov" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["security", "tls", "ssl", "http-headers", "hsts", "csp", "web-security"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
web-sec-check = "web_sec_check.cli:main"

[tool.setuptools]
packages = ["web_sec_check"]
